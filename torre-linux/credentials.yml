---
controller_credentials:
  - name: "Linux Produccion"
    organization: "Torre-Linux"
    credential_type: "Machine"
    description: "SSH a servidores Linux de producción"
    inputs:
      username: "ansible-svc"
      password: "{{ vault_linux_prod_password }}"
      become_method: "sudo"
      become_username: "root"
      become_password: "{{ vault_linux_prod_password }}"

  - name: "Linux Pre-Produccion"
    organization: "Torre-Linux"
    credential_type: "Machine"
    description: "SSH a servidores Linux de pre-producción"
    inputs:
      username: "ansible-svc-pre"
      password: "{{ vault_linux_pre_password }}"
      become_method: "sudo"
      become_username: "root"
      become_password: "{{ vault_linux_pre_password }}"

  - name: "Oracle DB Produccion"
    organization: "Torre-Linux"
    credential_type: "Machine"
    description: "Acceso a servidores de base de datos Oracle"
    inputs:
      username: "ansible-db-svc"
      password: "{{ vault_oracle_db_password }}"
