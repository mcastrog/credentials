---
- name: "CaC - Aplicar configuración de {{ torre }}"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../common/secrets.yml
    - "../{{ torre }}/secrets.yml"
    - "../{{ torre }}/credentials.yml"
    - "../{{ torre }}/projects.yml"
    - "../{{ torre }}/inventories.yml"
    - "../{{ torre }}/job_templates.yml"

  vars:
    aap_hostname: "{{ vault_controller_hostname }}"
    aap_username: "{{ vault_controller_username }}"
    aap_password: "{{ vault_controller_password }}"
    aap_validate_certs: false

  roles:
    - role: infra.aap_configuration.dispatch
