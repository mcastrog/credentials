---
- name: "CaC - Configuración común (organizaciones y equipos)"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../common/secrets.yml
    - ../common/organizations.yml

  vars:
    aap_hostname: "{{ vault_controller_hostname }}"
    aap_username: "{{ vault_controller_username }}"
    aap_password: "{{ vault_controller_password }}"
    aap_validate_certs: false

  roles:
    - role: infra.aap_configuration.dispatch
