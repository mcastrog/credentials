---
- name: "CaC - Bootstrap: recrea AAP completo desde cero"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../common/secrets.yml
    - ../common/organizations.yml
    - ../common/bootstrap.yml

  vars:
    aap_hostname: "{{ vault_controller_hostname }}"
    aap_username: "{{ vault_controller_username }}"
    aap_password: "{{ vault_controller_password }}"
    aap_validate_certs: false

  roles:
    - role: infra.aap_configuration.dispatch

  post_tasks:
    - name: "Bootstrap completado"
      ansible.builtin.debug:
        msg: >-
          Bootstrap OK. Configura el webhook en GitHub apuntando a:
          {{ aap_hostname }}/api/controller/v2/workflow_job_templates/CaC+-+Despliegue+Completo/github/
          A partir de ahora, cada push ejecuta el CaC completo.
