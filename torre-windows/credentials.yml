---
controller_credentials:
  - name: "Windows Produccion"
    organization: "Torre-Windows"
    credential_type: "Machine"
    description: "WinRM a servidores Windows de producción"
    inputs:
      username: "svc-ansible-win@mapfre.local"
      password: "{{ vault_windows_prod_password }}"

  - name: "Windows Pre-Produccion"
    organization: "Torre-Windows"
    credential_type: "Machine"
    description: "WinRM a servidores Windows de pre-producción"
    inputs:
      username: "svc-ansible-win-pre@mapfre.local"
      password: "{{ vault_windows_pre_password }}"
