---
- name: "Tests adicionales - vias no probadas"
  hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    group/ansible.controller.controller:
      controller_host: "{{ aap_hostname }}"
      controller_username: "{{ aap_username }}"
      controller_password: "{{ aap_password }}"
      validate_certs: "{{ aap_validate_certs | default(false) }}"

  vars:
    platform_auth: &platform_auth
      aap_hostname: "{{ aap_hostname }}"
      aap_username: "{{ aap_username }}"
      aap_password: "{{ aap_password }}"
      aap_validate_certs: "{{ aap_validate_certs | default(false) }}"

  tasks:
    # ==========================================================================
    # TEST 5A: ansible.platform.role_user_assignment con object_ids (como Ismael)
    # Ismael usa: object_ids: ["{{ team_name }}"] con un NOMBRE, no un ID
    # ==========================================================================
    - name: "5A - platform.role_user_assignment con object_ids usando NOMBRE (como ejemplo Ismael)"
      ansible.platform.role_user_assignment:
        <<: *platform_auth
        user: "user-test-rbac"
        role_definition: "Team Member"
        object_ids:
          - "Team-Test-RBAC"
        state: present
      register: test_5a
      ignore_errors: true

    - name: "Resultado 5A"
      ansible.builtin.debug:
        var: test_5a

    - name: "5A2 - platform.role_team_assignment con assignment_objects para TEAM"
      ansible.platform.role_team_assignment:
        <<: *platform_auth
        team: "Team-Test-RBAC"
        role_definition: "Team Member"
        assignment_objects:
          - name: "Team-Test-RBAC"
            type: "teams"
        state: present
      register: test_5a2
      ignore_errors: true

    - name: "Resultado 5A2"
      ansible.builtin.debug:
        var: test_5a2

    # ==========================================================================
    # TEST 5B: object_ansible_id - UUID estable que sobrevive recreaciones?
    # ==========================================================================
    - name: "5B1 - Obtener ansible_id del JT via API"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/job_templates/?name=JT-Test-RBAC&organization__name=Org-Test-RBAC"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: jt_info

    - name: "5B2 - Mostrar campos del JT (buscamos ansible_id)"
      ansible.builtin.debug:
        msg: |
          JT Name: {{ jt_info.json.results[0].name }}
          JT ID: {{ jt_info.json.results[0].id }}
          JT related keys: {{ jt_info.json.results[0].related.keys() | list }}
          JT summary keys: {{ jt_info.json.results[0].summary_fields.keys() | list }}
          JT tiene ansible_id: {{ jt_info.json.results[0].ansible_id | default('NO EXISTE') }}

    - name: "5B3 - Buscar ansible_id en el gateway"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/gateway/v1/role_team_assignments/?team__name=Team-Test-RBAC"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: existing_assignments
      ignore_errors: true

    - name: "5B4 - Assignments existentes (buscar object_ansible_id)"
      ansible.builtin.debug:
        msg: "{{ existing_assignments.json }}"
      when: existing_assignments is not failed

    # ==========================================================================
    # TEST 5C: controller.role_team_assignment con object_ansible_id (UUID)
    # ==========================================================================
    - name: "5C - Obtener ansible_id del inventario via gateway resources"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/gateway/v1/resources/?name=Inventario-Test-RBAC&resource_type=shared.inventory"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: resource_lookup
      ignore_errors: true

    - name: "5C2 - Resultado resource lookup"
      ansible.builtin.debug:
        var: resource_lookup.json
      when: resource_lookup is not failed

    # ==========================================================================
    # TEST 5D: platform.role_user_assignment con object_id numerico
    # (vimos que NO acepta assignment_objects pero SI acepta object_id)
    # ==========================================================================
    - name: "5D - platform.role_user_assignment con object_id numerico para org"
      ansible.platform.role_user_assignment:
        <<: *platform_auth
        user: "user-test-rbac"
        role_definition: "Organization Member"
        object_id: "{{ jt_info.json.results[0].organization }}"
        state: present
      register: test_5d
      ignore_errors: true

    - name: "Resultado 5D"
      ansible.builtin.debug:
        var: test_5d

    - name: "5D2 - platform.role_user_assignment con object_id para JT (controller object)"
      ansible.platform.role_user_assignment:
        <<: *platform_auth
        user: "user-test-rbac"
        role_definition: "JobTemplate Execute"
        object_id: "{{ jt_info.json.results[0].id }}"
        state: present
      register: test_5d2
      ignore_errors: true

    - name: "Resultado 5D2"
      ansible.builtin.debug:
        var: test_5d2

    # ==========================================================================
    # TEST 5E: ansible.controller.role_team_assignment buscando parametros ocultos
    # ==========================================================================
    - name: "5E - Listar TODOS los parametros que acepta role_team_assignment"
      ansible.controller.role_team_assignment:
        team: "Team-Test-RBAC"
        role_definition: "JobTemplate Execute"
        object_id: "{{ jt_info.json.results[0].id }}"
        state: present
      register: test_5e

    - name: "5E - Parametros devueltos"
      ansible.builtin.debug:
        var: test_5e

    # ==========================================================================
    # RESUMEN
    # ==========================================================================
    - name: "RESUMEN TESTS ADICIONALES"
      ansible.builtin.debug:
        msg: |
          === TESTS ADICIONALES ===
          5A  (platform.role_user_assignment object_ids con NOMBRE): {{ 'OK' if test_5a is not failed else 'FALLO - ' + (test_5a.msg | default(''))[:120] }}
          5A2 (platform.role_team_assignment teams):                 {{ 'OK' if test_5a2 is not failed else 'FALLO - ' + (test_5a2.msg | default(''))[:120] }}
          5D  (platform.role_user_assignment object_id org):         {{ 'OK' if test_5d is not failed else 'FALLO - ' + (test_5d.msg | default(''))[:120] }}
          5D2 (platform.role_user_assignment object_id JT):          {{ 'OK' if test_5d2 is not failed else 'FALLO - ' + (test_5d2.msg | default(''))[:120] }}
