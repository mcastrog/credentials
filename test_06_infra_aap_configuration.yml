---
- name: "Test infra.aap_configuration - roles CasC para RBAC"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_hostname: "{{ aap_hostname }}"
    aap_username: "{{ aap_username }}"
    aap_password: "{{ aap_password }}"
    aap_validate_certs: "{{ aap_validate_certs | default(false) }}"

  tasks:
    # ==========================================================================
    # TEST 6A: Usar ansible.controller.role directamente (lo que controller_roles
    # hace por debajo, sin el wrapper async que falla)
    # ==========================================================================
    - name: "6A - ansible.controller.role (lo que usa controller_roles por debajo)"
      ansible.controller.role:
        team: "Team-Test-RBAC"
        role: "execute"
        job_templates:
          - "JT-Test-RBAC"
        lookup_organization: "Org-Test-RBAC"
        state: present
      register: test_6a
      ignore_errors: true

    - name: "Resultado 6A"
      ansible.builtin.debug:
        msg: "6A ansible.controller.role (por nombre): {{ 'OK' if test_6a is not failed else 'FALLO - ' + (test_6a.msg | default(''))[:100] }}"

    # ==========================================================================
    # TEST 6B: controller_role_team_assignments con object_id
    # ==========================================================================
    - name: "6B1 - Resolver ID del inventario"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/inventories/?name=Inventario-Test-RBAC&organization__name=Org-Test-RBAC"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: inv_lookup

    - name: "6B2 - ansible.controller.role_team_assignment (lo que usa controller_role_team_assignments)"
      ansible.controller.role_team_assignment:
        team: "Team-Test-RBAC"
        role_definition: "Inventory Update"
        object_id: "{{ inv_lookup.json.results[0].id }}"
        state: present
      register: test_6b
      ignore_errors: true

    - name: "Resultado 6B"
      ansible.builtin.debug:
        msg: "6B role_team_assignment con object_id: {{ 'OK' if test_6b is not failed else 'FALLO - ' + (test_6b.msg | default(''))[:100] }}"

    # ==========================================================================
    # TEST 6C: gateway_role_team_assignments - asignar org por nombre
    # ==========================================================================
    - name: "6C - ansible.platform.role_team_assignment (lo que usa gateway_role_team_assignments)"
      ansible.platform.role_team_assignment:
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: false
        team: "Team-Test-RBAC"
        role_definition: "Organization Audit"
        assignment_objects:
          - name: "Org-Test-RBAC"
            type: "organizations"
        state: present
      register: test_6c
      ignore_errors: true

    - name: "Resultado 6C"
      ansible.builtin.debug:
        msg: "6C platform.role_team_assignment (org por nombre): {{ 'OK' if test_6c is not failed else 'FALLO - ' + (test_6c.msg | default(''))[:100] }}"

    # ==========================================================================
    # TEST 6D: gateway_role_user_assignments - asignar usuario a org por nombre
    # ==========================================================================
    - name: "6D - ansible.platform.role_user_assignment (lo que usa gateway_role_user_assignments)"
      ansible.platform.role_user_assignment:
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: false
        user: "user-test-rbac"
        role_definition: "Organization Audit"
        object_ids:
          - "Org-Test-RBAC"
        state: present
      register: test_6d
      ignore_errors: true

    - name: "Resultado 6D"
      ansible.builtin.debug:
        msg: "6D platform.role_user_assignment (org por nombre): {{ 'OK' if test_6d is not failed else 'FALLO - ' + (test_6d.msg | default(''))[:100] }}"

    # ==========================================================================
    # RESUMEN
    # ==========================================================================
    - name: "RESUMEN infra.aap_configuration (modulos subyacentes)"
      ansible.builtin.debug:
        msg: |
          === TESTS infra.aap_configuration (modulos que usan los roles por debajo) ===
          6A controller.role (legacy, por nombre):                      {{ 'OK' if test_6a is not failed else 'FALLO' }}
          6B controller.role_team_assignment (object_id):               {{ 'OK' if test_6b is not failed else 'FALLO' }}
          6C platform.role_team_assignment (org por nombre):            {{ 'OK' if test_6c is not failed else 'FALLO' }}
          6D platform.role_user_assignment (org por nombre):            {{ 'OK' if test_6d is not failed else 'FALLO' }}

          NOTA: Estos son los modulos que infra.aap_configuration invoca internamente:
          - controller_roles         -> ansible.controller.role (deprecated, acepta nombres)
          - controller_role_team_assignments -> ansible.controller.role_team_assignment (requiere object_id)
          - gateway_role_team_assignments    -> ansible.platform.role_team_assignment (acepta nombres para orgs/teams)
          - gateway_role_user_assignments    -> ansible.platform.role_user_assignment (acepta nombres para orgs/teams)
