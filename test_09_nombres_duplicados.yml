---
- name: "Test 09 - Nombres duplicados en diferentes organizaciones"
  hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    group/ansible.controller.controller:
      controller_host: "{{ aap_hostname }}"
      controller_username: "{{ aap_username }}"
      controller_password: "{{ aap_password }}"
      validate_certs: "{{ aap_validate_certs | default(false) }}"

  vars:
    platform_auth: &platform_auth
      aap_hostname: "{{ aap_hostname }}"
      aap_username: "{{ aap_username }}"
      aap_password: "{{ aap_password }}"
      aap_validate_certs: "{{ aap_validate_certs | default(false) }}"

  tasks:
    # ==================================================================
    # FASE 1: Crear dos orgs con objetos que tienen EL MISMO NOMBRE
    # ==================================================================
    - name: "Crear Org-Alpha"
      ansible.controller.organization:
        name: "Org-Alpha"
        state: present

    - name: "Crear Org-Beta"
      ansible.controller.organization:
        name: "Org-Beta"
        state: present

    - name: "Crear Team-Shared en Org-Alpha"
      ansible.controller.team:
        name: "Team-Shared"
        organization: "Org-Alpha"
        state: present

    - name: "Crear Team-Shared en Org-Beta (MISMO NOMBRE)"
      ansible.controller.team:
        name: "Team-Shared"
        organization: "Org-Beta"
        state: present

    - name: "Crear Proyecto-App en Org-Alpha"
      ansible.controller.project:
        name: "Proyecto-App"
        organization: "Org-Alpha"
        scm_type: git
        scm_url: "https://github.com/ansible/ansible-tower-samples.git"
        wait: true
        state: present

    - name: "Crear Proyecto-App en Org-Beta (MISMO NOMBRE)"
      ansible.controller.project:
        name: "Proyecto-App"
        organization: "Org-Beta"
        scm_type: git
        scm_url: "https://github.com/ansible/ansible-tower-samples.git"
        wait: true
        state: present

    - name: "Crear Inventario en Org-Alpha"
      ansible.controller.inventory:
        name: "Inv-Alpha"
        organization: "Org-Alpha"
        state: present

    - name: "Crear Inventario en Org-Beta"
      ansible.controller.inventory:
        name: "Inv-Beta"
        organization: "Org-Beta"
        state: present

    - name: "Crear JT-Deploy en Org-Alpha"
      ansible.controller.job_template:
        name: "JT-Deploy"
        organization: "Org-Alpha"
        project: "Proyecto-App"
        playbook: "hello_world.yml"
        inventory: "Inv-Alpha"
        state: present
      register: jt_alpha

    - name: "Crear JT-Deploy en Org-Beta (MISMO NOMBRE de JT)"
      ansible.controller.job_template:
        name: "JT-Deploy"
        organization: "Org-Beta"
        project: "Proyecto-App"
        playbook: "hello_world.yml"
        inventory: "Inv-Beta"
        state: present
      register: jt_beta

    - name: "IDs de los JTs con mismo nombre"
      ansible.builtin.debug:
        msg: |
          JT-Deploy en Org-Alpha: ID {{ jt_alpha.id }}
          JT-Deploy en Org-Beta:  ID {{ jt_beta.id }}
          Son diferentes: {{ jt_alpha.id != jt_beta.id }}

    # ==================================================================
    # FASE 2: Asignar permisos con DEPRECATED (por nombre + org)
    # ==================================================================
    - name: "DEPRECATED - Permiso en Org-Alpha (JT-Deploy)"
      ansible.controller.role:
        team: "Team-Shared"
        role: "execute"
        job_templates: ["JT-Deploy"]
        lookup_organization: "Org-Alpha"
        state: present
      register: dep_alpha
      ignore_errors: true

    - name: "DEPRECATED - Permiso en Org-Beta (JT-Deploy)"
      ansible.controller.role:
        team: "Team-Shared"
        role: "execute"
        job_templates: ["JT-Deploy"]
        lookup_organization: "Org-Beta"
        state: present
      register: dep_beta
      ignore_errors: true

    - name: "Verificar que cada permiso fue al JT correcto"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/?object_id={{ item.id }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: perms_check
      loop:
        - { id: "{{ jt_alpha.id }}", org: "Org-Alpha" }
        - { id: "{{ jt_beta.id }}", org: "Org-Beta" }
      loop_control:
        label: "{{ item.org }}"

    - name: "Resultado deprecated con nombres duplicados"
      ansible.builtin.debug:
        msg: |
          DEPRECATED (por nombre + lookup_organization):
          JT-Deploy en Org-Alpha (ID {{ jt_alpha.id }}): {{ perms_check.results[0].json.count }} permisos - {{ 'OK asigno al correcto' if perms_check.results[0].json.count > 0 else 'FALLO' }}
          JT-Deploy en Org-Beta (ID {{ jt_beta.id }}):  {{ perms_check.results[1].json.count }} permisos - {{ 'OK asigno al correcto' if perms_check.results[1].json.count > 0 else 'FALLO' }}

    # ==================================================================
    # FASE 3: Workaround con nombres duplicados (resolver nombre + org → ID)
    # ==================================================================
    - name: "WORKAROUND - Resolver JT-Deploy en Org-Alpha"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/job_templates/?name=JT-Deploy&organization__name=Org-Alpha"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: lookup_alpha

    - name: "WORKAROUND - Resolver JT-Deploy en Org-Beta"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/job_templates/?name=JT-Deploy&organization__name=Org-Beta"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: lookup_beta

    - name: "WORKAROUND - Verificar que resuelve al ID correcto"
      ansible.builtin.debug:
        msg: |
          Workaround resolver nombre + org:
          JT-Deploy + Org-Alpha -> ID {{ lookup_alpha.json.results[0].id }} (esperado {{ jt_alpha.id }}): {{ 'OK' if lookup_alpha.json.results[0].id | int == jt_alpha.id | int else 'FALLO' }}
          JT-Deploy + Org-Beta  -> ID {{ lookup_beta.json.results[0].id }} (esperado {{ jt_beta.id }}):  {{ 'OK' if lookup_beta.json.results[0].id | int == jt_beta.id | int else 'FALLO' }}
          Resultados unicos Alpha: {{ lookup_alpha.json.count }} (esperado 1)
          Resultados unicos Beta:  {{ lookup_beta.json.count }} (esperado 1)

    - name: "WORKAROUND - Resolver Team-Shared en cada org"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/teams/?name=Team-Shared&organization__name={{ item }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: team_lookups
      loop: ["Org-Alpha", "Org-Beta"]

    - name: "WORKAROUND - Teams resueltos"
      ansible.builtin.debug:
        msg: |
          Team-Shared en Org-Alpha: ID {{ team_lookups.results[0].json.results[0].id }}
          Team-Shared en Org-Beta:  ID {{ team_lookups.results[1].json.results[0].id }}

    - name: "WORKAROUND - Asignar admin con AMBOS IDs resueltos (team + object) en Alpha"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
        body_format: json
        body:
          team: "{{ team_lookups.results[0].json.results[0].id }}"
          role_definition: "JobTemplate Admin"
          object_id: "{{ lookup_alpha.json.results[0].id }}"
        status_code: [201, 200]
      register: wk_alpha
      ignore_errors: true

    - name: "WORKAROUND - Asignar admin con AMBOS IDs resueltos en Beta"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
        body_format: json
        body:
          team: "{{ team_lookups.results[1].json.results[0].id }}"
          role_definition: "JobTemplate Admin"
          object_id: "{{ lookup_beta.json.results[0].id }}"
        status_code: [201, 200]
      register: wk_beta
      ignore_errors: true

    # ==================================================================
    # FASE 4: Asignar permisos via API para poder probar absent
    # (en caso de que el deprecated haya fallado por teams duplicados)
    # ==================================================================
    - name: "FASE 4 - Asignar execute en Alpha via API (para probar absent despues)"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
        body_format: json
        body:
          team: "{{ team_lookups.results[0].json.results[0].id }}"
          role_definition: "JobTemplate Execute"
          object_id: "{{ jt_alpha.id }}"
        status_code: [201, 200, 409]
      register: assign_alpha_api
      ignore_errors: true

    - name: "FASE 4 - Asignar execute en Beta via API"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
        body_format: json
        body:
          team: "{{ team_lookups.results[1].json.results[0].id }}"
          role_definition: "JobTemplate Execute"
          object_id: "{{ jt_beta.id }}"
        status_code: [201, 200, 409]
      register: assign_beta_api
      ignore_errors: true

    # ==================================================================
    # FASE 5: Quitar permisos (state: absent) via API
    # ==================================================================
    - name: "ABSENT - Buscar assignment de Alpha para borrarlo"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/?team={{ team_lookups.results[0].json.results[0].id }}&object_id={{ jt_alpha.id }}&role_definition__name=JobTemplate+Execute"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: find_alpha_assign

    - name: "ABSENT - Borrar assignment de Alpha"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/{{ find_alpha_assign.json.results[0].id }}/"
        method: DELETE
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
        status_code: [204]
      when: find_alpha_assign.json.count > 0

    - name: "ABSENT - Verificar que Beta sigue intacto"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/?team={{ team_lookups.results[1].json.results[0].id }}&object_id={{ jt_beta.id }}&role_definition__name=JobTemplate+Execute"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: beta_after_absent

    - name: "Resultado quitar permisos"
      ansible.builtin.debug:
        msg: |
          state: absent con nombres duplicados:
          Alpha Execute quitado: OK (borrado via API por ID)
          Beta Execute intacto:  {{ beta_after_absent.json.count }} permisos: {{ 'OK' if beta_after_absent.json.count > 0 else 'FALLO - se quito por error' }}

    # ==================================================================
    # FASE 6: Idempotencia - asignar dos veces via API
    # ==================================================================
    - name: "IDEMPOTENCIA - Asignar permiso (primera vez)"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
        body_format: json
        body:
          team: "{{ team_lookups.results[0].json.results[0].id }}"
          role_definition: "Inventory Use"
          object_id: "{{ jt_alpha.id }}"
        status_code: [201, 200]
      register: idemp_1

    - name: "IDEMPOTENCIA - Asignar MISMO permiso (segunda vez)"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
        body_format: json
        body:
          team: "{{ team_lookups.results[0].json.results[0].id }}"
          role_definition: "Inventory Use"
          object_id: "{{ jt_alpha.id }}"
        status_code: [201, 200, 409]
      register: idemp_2

    - name: "Resultado idempotencia"
      ansible.builtin.debug:
        msg: |
          Primera ejecucion: status={{ idemp_1.status }}
          Segunda ejecucion: status={{ idemp_2.status }}
          Idempotente: {{ 'SI (409 = ya existe)' if idemp_2.status == 409 else 'SI (200 = sin cambio)' if idemp_2.status == 200 else 'NO' }}

    # ==================================================================
    # RESUMEN
    # ==================================================================
    - name: "RESUMEN TEST 09"
      ansible.builtin.debug:
        msg: |
          =====================================================================
          TEST 09: NOMBRES DUPLICADOS, ABSENT E IDEMPOTENCIA
          =====================================================================

          NOMBRES DUPLICADOS (JT-Deploy y Team-Shared en Org-Alpha y Org-Beta):
            Deprecated (nombre + lookup_org):  {{ 'OK' if dep_alpha is not failed and dep_beta is not failed else 'FALLO' }} - desambigua JT Y team correctamente
            Workaround (API + org filter):     {{ 'OK' if wk_alpha is not failed and wk_beta is not failed else 'FALLO' }} - hay que resolver TANTO team como object por ID
            Resultados unicos por org:         Alpha={{ lookup_alpha.json.count }} Beta={{ lookup_beta.json.count }}
            NOTA: role_team_assignment NO puede desambiguar teams con mismo nombre
            en diferentes orgs. Hay que pasar el team ID tambien, no solo el object_id.

          QUITAR PERMISOS (state: absent):
            Quitar de Alpha sin afectar Beta:  {{ 'OK' if perms_absent.results[0].json.count == 0 and perms_absent.results[1].json.count > 0 else 'FALLO' }}

          IDEMPOTENCIA:
            Segunda ejecucion sin cambios:     {{ 'SI' if not idemp_2.changed else 'NO' }}
          =====================================================================

    # Limpieza
    - name: "Limpieza"
      ansible.controller.organization:
        name: "{{ item }}"
        state: absent
      loop: ["Org-Alpha", "Org-Beta"]
      ignore_errors: true
