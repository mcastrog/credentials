---
# === Conexión al controller ===
controller_host: "https://aap-aap.apps.qww9gs2l.eastus.aroapp.io"
controller_user: admin

# === Organizaciones ===
controller_organizations:
  - name: "Torre-Linux"
    description: "Equipo de administración Linux"
  - name: "Torre-Windows"
    description: "Equipo de administración Windows"
  - name: "Torre-Cloud"
    description: "Equipo de infraestructura Cloud"

# === Credenciales ===
controller_credentials:
  # --- Torre-Linux ---
  - name: "Linux Produccion"
    organization: "Torre-Linux"
    credential_type: "Machine"
    description: "Acceso SSH a servidores Linux de producción"
    inputs:
      username: "ansible-svc"
      password: "{{ vault_linux_prod_password }}"
      become_method: "sudo"
      become_username: "root"
      become_password: "{{ vault_linux_prod_password }}"

  - name: "Linux Pre-Produccion"
    organization: "Torre-Linux"
    credential_type: "Machine"
    description: "Acceso SSH a servidores Linux de pre-producción"
    inputs:
      username: "ansible-svc-pre"
      password: "{{ vault_linux_pre_password }}"
      become_method: "sudo"
      become_username: "root"
      become_password: "{{ vault_linux_pre_password }}"

  # --- Torre-Windows ---
  - name: "Windows Produccion"
    organization: "Torre-Windows"
    credential_type: "Machine"
    description: "Acceso WinRM a servidores Windows de producción"
    inputs:
      username: "svc-ansible-win@mapfre.local"
      password: "{{ vault_windows_prod_password }}"

  # --- Torre-Cloud ---
  - name: "AWS Produccion"
    organization: "Torre-Cloud"
    credential_type: "Amazon Web Services"
    description: "Credenciales AWS para entorno de producción"
    inputs:
      username: "{{ vault_aws_access_key }}"
      password: "{{ vault_aws_secret_key }}"

  - name: "vCenter Corporativo"
    organization: "Torre-Cloud"
    credential_type: "VMware vCenter"
    description: "Acceso a vCenter corporativo"
    inputs:
      host: "vcenter.mapfre.local"
      username: "svc-ansible@vsphere.local"
      password: "{{ vault_vcenter_password }}"
