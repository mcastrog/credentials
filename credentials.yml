---
controller_hostname: https://aap26-growth.lab.local
controller_username: admin
controller_password: "{{ vault_controller_password }}"
controller_validate_certs: false

controller_credentials:
  # Credencial tipo Machine (SSH)
  - name: "Credencial Linux Produccion"
    organization: "Torre-Linux"
    credential_type: "Machine"
    description: "Acceso SSH a servidores Linux de producción"
    inputs:
      username: "ansible-svc"
      password: "{{ vault_machine_password }}"
      become_method: "sudo"
      become_username: "root"
      become_password: "{{ vault_machine_password }}"

  # Credencial tipo vCenter
  - name: "Credencial vCenter Mapfre"
    organization: "Torre-Linux"
    credential_type: "VMware vCenter"
    description: "Acceso a vCenter para snapshots"
    inputs:
      host: "vcenter.mapfre.local"
      username: "svc-ansible@vsphere.local"
      password: "{{ vault_vcenter_password }}"

  # Credencial tipo AAP (para cross-org API)
  - name: "Credencial AAP Cross-Org"
    organization: "Torre-Linux"
    credential_type: "Red Hat Ansible Automation Platform"
    description: "Credencial de servicio para invocación cross-org vía API"
    inputs:
      host: "https://aap.mapfre.local"
      username: "svc-cross-org"
      password: "{{ vault_aap_token }}"
