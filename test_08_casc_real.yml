---
- name: "Test 08 - Flujo CasC real como lo hace el cliente"
  hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    group/ansible.controller.controller:
      controller_host: "{{ aap_hostname }}"
      controller_username: "{{ aap_username }}"
      controller_password: "{{ aap_password }}"
      validate_certs: "{{ aap_validate_certs | default(false) }}"

  vars:
    aap_hostname: "{{ aap_hostname }}"
    aap_username: "{{ aap_username }}"
    aap_password: "{{ aap_password }}"
    aap_validate_certs: false

    # =====================================================
    # DATOS CasC - Asi define el cliente su configuracion
    # Objetos referenciados SIEMPRE por NOMBRE
    # =====================================================
    casc_org: "CasC-Demo-Org"
    casc_team: "CasC-Demo-Team"
    casc_user: "casc-user1"
    casc_inv: "CasC-Demo-Inventory"
    casc_proj: "CasC-Demo-Project"
    casc_jt: "CasC-Demo-JT"
    casc_cred: "CasC-Demo-Credential"

    # Permisos definidos como datos (como en el repo del cliente)
    casc_permissions:
      - team: "{{ casc_team }}"
        role: "execute"
        job_templates: ["{{ casc_jt }}"]
        lookup_organization: "{{ casc_org }}"
      - team: "{{ casc_team }}"
        role: "use"
        inventories: ["{{ casc_inv }}"]
        lookup_organization: "{{ casc_org }}"
      - user: "{{ casc_user }}"
        role: "use"
        projects: ["{{ casc_proj }}"]
        lookup_organization: "{{ casc_org }}"
      - user: "{{ casc_user }}"
        role: "use"
        credentials: ["{{ casc_cred }}"]
        lookup_organization: "{{ casc_org }}"

  tasks:
    # ==================================================================
    # FASE 1: Crear toda la infraestructura CasC (con modulos directos)
    # ==================================================================
    - name: "FASE 1.1 - Crear organizacion"
      ansible.controller.organization:
        name: "{{ casc_org }}"
        state: present

    - name: "FASE 1.2 - Crear team"
      ansible.controller.team:
        name: "{{ casc_team }}"
        organization: "{{ casc_org }}"
        state: present

    - name: "FASE 1.3 - Crear usuario"
      ansible.controller.user:
        username: "{{ casc_user }}"
        password: "password123!"
        email: "casc-user1@example.com"
        state: present

    - name: "FASE 1.4 - Crear credencial"
      ansible.controller.credential:
        name: "{{ casc_cred }}"
        credential_type: "Machine"
        organization: "{{ casc_org }}"
        inputs:
          username: "demo"
          password: "demo123"
        state: present

    - name: "FASE 1.5 - Crear proyecto"
      ansible.controller.project:
        name: "{{ casc_proj }}"
        organization: "{{ casc_org }}"
        scm_type: git
        scm_url: "https://github.com/ansible/ansible-tower-samples.git"
        wait: true
        state: present

    - name: "FASE 1.6 - Crear inventario"
      ansible.controller.inventory:
        name: "{{ casc_inv }}"
        organization: "{{ casc_org }}"
        state: present

    - name: "FASE 1.7 - Crear job template"
      ansible.controller.job_template:
        name: "{{ casc_jt }}"
        organization: "{{ casc_org }}"
        project: "{{ casc_proj }}"
        playbook: "hello_world.yml"
        inventory: "{{ casc_inv }}"
        state: present

    - name: "FASE 1 COMPLETADA"
      ansible.builtin.debug:
        msg: "Infraestructura CasC creada: org, team, user, cred, project, inventory, JT"

    # ==================================================================
    # FASE 2: Aplicar permisos con metodo LEGACY (deprecated, por nombre)
    # Como lo hace el cliente con controller_roles de infra.aap_configuration
    # ==================================================================
    - name: "FASE 2 - Aplicar permisos por NOMBRE (metodo legacy)"
      ansible.controller.role:
        team: "{{ item.team | default(omit) }}"
        user: "{{ item.user | default(omit) }}"
        role: "{{ item.role }}"
        job_templates: "{{ item.job_templates | default(omit) }}"
        inventories: "{{ item.inventories | default(omit) }}"
        projects: "{{ item.projects | default(omit) }}"
        credentials: "{{ item.credentials | default(omit) }}"
        lookup_organization: "{{ item.lookup_organization }}"
        state: present
      loop: "{{ casc_permissions }}"
      loop_control:
        label: "{{ item.role }} -> {{ item.team | default(item.user) }}"
      register: fase2

    - name: "FASE 2 - Permisos gateway (org membership por nombre)"
      ansible.platform.role_team_assignment:
        aap_hostname: "{{ aap_hostname }}"
        aap_username: "{{ aap_username }}"
        aap_password: "{{ aap_password }}"
        aap_validate_certs: false
        team: "{{ casc_team }}"
        role_definition: "Organization Member"
        assignment_objects:
          - name: "{{ casc_org }}"
            type: "organizations"
        state: present

    - name: "FASE 2 COMPLETADA"
      ansible.builtin.debug:
        msg: "Permisos aplicados: {{ fase2.results | map(attribute='role') | list }}"

    # ==================================================================
    # FASE 3: Verificar permisos
    # ==================================================================
    - name: "FASE 3 - Obtener ID del JT"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/job_templates/?name={{ casc_jt | urlencode }}&organization__name={{ casc_org | urlencode }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: jt_info

    - name: "FASE 3 - Verificar permisos del team sobre JT"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/?team__name={{ casc_team | urlencode }}&object_id={{ jt_info.json.results[0].id }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: perms_antes

    - name: "FASE 3 - Permisos verificados"
      ansible.builtin.debug:
        msg: "JT {{ casc_jt }} (ID {{ jt_info.json.results[0].id }}): {{ perms_antes.json.count }} permisos asignados al team"

    # ==================================================================
    # FASE 4: RECREAR el JT (simula eliminacion y recreacion por CasC)
    # ==================================================================
    - name: "FASE 4 - Guardar ID original"
      ansible.builtin.set_fact:
        jt_id_original: "{{ jt_info.json.results[0].id }}"

    - name: "FASE 4 - BORRAR JT (simula que alguien lo borra o se recrea)"
      ansible.controller.job_template:
        name: "{{ casc_jt }}"
        organization: "{{ casc_org }}"
        state: absent

    - name: "FASE 4 - RECREAR JT (como haria el CasC al re-ejecutarse)"
      ansible.controller.job_template:
        name: "{{ casc_jt }}"
        organization: "{{ casc_org }}"
        project: "{{ casc_proj }}"
        playbook: "hello_world.yml"
        inventory: "{{ casc_inv }}"
        state: present
      register: jt_recreado

    - name: "FASE 4 - Comparar IDs"
      ansible.builtin.debug:
        msg: |
          ID ORIGINAL: {{ jt_id_original }}
          ID RECREADO: {{ jt_recreado.id }}
          EL ID HA CAMBIADO: {{ jt_id_original | int != jt_recreado.id | int }}

    - name: "FASE 4 - Verificar permisos sobre JT recreado (ANTES de re-aplicar)"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/?team__name={{ casc_team | urlencode }}&object_id={{ jt_recreado.id }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: perms_post_recrear

    - name: "FASE 4 - PERMISOS PERDIDOS"
      ansible.builtin.debug:
        msg: "Permisos sobre JT recreado (ID {{ jt_recreado.id }}): {{ perms_post_recrear.json.count }} (ESPERADO: 0 - SE PIERDEN)"

    # ==================================================================
    # FASE 5: Re-ejecutar el CasC (como si fuera un push al repo + webhook)
    # Los permisos legacy (por nombre) deberian reasignarse automaticamente
    # ==================================================================
    - name: "FASE 5 - Re-aplicar permisos por NOMBRE (re-run CasC)"
      ansible.controller.role:
        team: "{{ item.team | default(omit) }}"
        user: "{{ item.user | default(omit) }}"
        role: "{{ item.role }}"
        job_templates: "{{ item.job_templates | default(omit) }}"
        inventories: "{{ item.inventories | default(omit) }}"
        projects: "{{ item.projects | default(omit) }}"
        credentials: "{{ item.credentials | default(omit) }}"
        lookup_organization: "{{ item.lookup_organization }}"
        state: present
      loop: "{{ casc_permissions }}"
      loop_control:
        label: "{{ item.role }} -> {{ item.team | default(item.user) }}"
      register: fase5

    - name: "FASE 5 - Verificar permisos restaurados"
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/controller/v2/role_team_assignments/?team__name={{ casc_team | urlencode }}&object_id={{ jt_recreado.id }}"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        validate_certs: false
        force_basic_auth: true
      register: perms_restaurados

    # ==================================================================
    # RESUMEN FINAL
    # ==================================================================
    - name: "RESUMEN FINAL"
      ansible.builtin.debug:
        msg: |
          =====================================================================
          RESUMEN: FLUJO CasC COMPLETO
          =====================================================================

          FASE 1 - Infraestructura CasC:                OK
          FASE 2 - Permisos legacy (por nombre):        OK ({{ fase2.results | length }} asignaciones)
          FASE 3 - Verificacion:                        {{ perms_antes.json.count }} permisos en JT
          FASE 4 - Recreacion JT:                       ID {{ jt_id_original }} -> {{ jt_recreado.id }}
          FASE 4 - Permisos tras recrear:               {{ perms_post_recrear.json.count }} (SE PIERDEN)
          FASE 5 - Re-run CasC (re-aplicar por nombre): {{ 'OK' if fase5 is not failed else 'FALLO' }}
          FASE 5 - Permisos restaurados:                {{ perms_restaurados.json.count }}

          CONCLUSION:
          El flujo CasC con ansible.controller.role (deprecated) FUNCIONA
          end-to-end. Al re-ejecutar el CasC tras la recreacion del objeto,
          los permisos se reasignan automaticamente porque se referencian
          por NOMBRE, no por ID. Este es el comportamiento que necesitais
          mantener y que los modulos nuevos (role_team_assignment) NO ofrecen
          de forma nativa.
          =====================================================================

    # Limpieza
    - name: "Limpieza"
      ansible.controller.organization:
        name: "{{ casc_org }}"
        state: absent
      ignore_errors: true
