---
- name: "CaC - Aplicar configuración de torre {{ torre }}"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "common/secrets.yml"
    - "{{ torre }}/secrets.yml"
    - "{{ torre }}/credentials.yml"
    - "{{ torre }}/projects.yml"
    - "{{ torre }}/inventories.yml"
    - "{{ torre }}/job_templates.yml"

  vars:
    controller_hostname: "https://aap-aap.apps.qww9gs2l.eastus.aroapp.io"
    controller_username: admin
    controller_password: "{{ vault_controller_password }}"
    controller_validate_certs: false

  tasks:
    # --- Credenciales ---
    - name: Crear/actualizar credenciales
      ansible.controller.credential:
        controller_host: "{{ controller_hostname }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        credential_type: "{{ item.credential_type }}"
        description: "{{ item.description | default(omit) }}"
        inputs: "{{ item.inputs }}"
        state: present
      loop: "{{ controller_credentials }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    # --- Proyectos ---
    - name: Crear/actualizar proyectos
      ansible.controller.project:
        controller_host: "{{ controller_hostname }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        scm_type: "{{ item.scm_type }}"
        scm_url: "{{ item.scm_url }}"
        scm_branch: "{{ item.scm_branch | default('main') }}"
        scm_update_on_launch: "{{ item.scm_update_on_launch | default(false) }}"
        description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ controller_projects }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Esperar a que los proyectos sincronicen
      ansible.controller.project:
        controller_host: "{{ controller_hostname }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        wait: true
        state: present
      loop: "{{ controller_projects }}"
      loop_control:
        label: "{{ item.name }}"

    # --- Inventarios ---
    - name: Crear/actualizar inventarios
      ansible.controller.inventory:
        controller_host: "{{ controller_hostname }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ controller_inventories }}"
      loop_control:
        label: "{{ item.name }}"

    # --- Hosts ---
    - name: Crear/actualizar hosts
      ansible.controller.host:
        controller_host: "{{ controller_hostname }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
        name: "{{ item.name }}"
        inventory: "{{ item.inventory }}"
        variables: "{{ item.variables | default(omit) }}"
        state: present
      loop: "{{ controller_hosts | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    # --- Grupos ---
    - name: Crear/actualizar grupos
      ansible.controller.group:
        controller_host: "{{ controller_hostname }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
        name: "{{ item.name }}"
        inventory: "{{ item.inventory }}"
        description: "{{ item.description | default(omit) }}"
        hosts: "{{ item.hosts | default(omit) }}"
        state: present
      loop: "{{ controller_groups | default([]) }}"
      loop_control:
        label: "{{ item.name }} ({{ item.inventory }})"

    # --- Asignar hosts a grupos ---
    - name: Asignar hosts a grupos
      ansible.controller.group:
        controller_host: "{{ controller_hostname }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
        name: "{{ item.group }}"
        inventory: "{{ item.inventory }}"
        hosts: "{{ item.hosts }}"
        state: present
      loop: "{{ controller_group_children | default([]) }}"
      loop_control:
        label: "{{ item.group }} ({{ item.inventory }})"
      when: controller_group_children is defined

    # --- Job Templates ---
    - name: Crear/actualizar Job Templates
      ansible.controller.job_template:
        controller_host: "{{ controller_hostname }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
        name: "{{ item.name }}"
        organization: "{{ item.organization }}"
        project: "{{ item.project }}"
        playbook: "{{ item.playbook }}"
        inventory: "{{ item.inventory }}"
        credential: "{{ item.credential | default(omit) }}"
        description: "{{ item.description | default(omit) }}"
        ask_limit_on_launch: "{{ item.ask_limit_on_launch | default(false) }}"
        ask_variables_on_launch: "{{ item.ask_variables_on_launch | default(false) }}"
        verbosity: "{{ item.verbosity | default(0) }}"
        state: present
      loop: "{{ controller_templates }}"
      loop_control:
        label: "{{ item.name }}"
