---
controller_credentials:
  - name: "AWS Produccion"
    organization: "Torre-Cloud"
    credential_type: "Amazon Web Services"
    description: "Credenciales AWS para entorno de producción"
    inputs:
      username: "{{ vault_aws_access_key }}"
      password: "{{ vault_aws_secret_key }}"

  - name: "vCenter Corporativo"
    organization: "Torre-Cloud"
    credential_type: "VMware vCenter"
    description: "Acceso a vCenter corporativo para gestión de VMs"
    inputs:
      host: "vcenter.mapfre.local"
      username: "svc-ansible@vsphere.local"
      password: "{{ vault_vcenter_password }}"

  - name: "Azure Produccion"
    organization: "Torre-Cloud"
    credential_type: "Microsoft Azure Resource Manager"
    description: "Service Principal Azure para entorno de producción"
    inputs:
      subscription: "{{ vault_azure_subscription_id }}"
      client: "{{ vault_azure_client_id }}"
      secret: "{{ vault_azure_secret }}"
      tenant: "{{ vault_azure_tenant }}"
